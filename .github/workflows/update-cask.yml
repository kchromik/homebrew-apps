name: Update WhisperBar Cask

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Stable Apple Silicon version (e.g. 1.20.1)"
        required: true
      download_url:
        description: "GitHub download URL to the WhisperBar DMG"
        required: true
  repository_dispatch:
    types: [update-cask]

concurrency:
  group: whisperbar-cask-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout current main
        uses: actions/checkout@v5
        with:
          ref: main
      - name: Test release guards
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Verify release and update cask
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_cask.py
      - name: Commit and push
        env:
          WHISPERBAR_VERSION: ${{ steps.update.outputs.version }}
        run: |
          if git diff --quiet -- Casks/w/whisperbar.rb; then
            echo "Cask is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/w/whisperbar.rb
          git commit -m "WhisperBar ${WHISPERBAR_VERSION}"
          git push origin HEAD:main
